name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (tsgo + biome)
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Package smoke
        run: npm pack --dry-run

      - name: Release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi

      - name: Distribution
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "## pi-apply-patch ${version}"
            echo
            echo "Distributed via git, not npm: the unscoped npm name belongs to another project."
            echo "Install with \`pi install git:github.com/${GITHUB_REPOSITORY}\` (or \`senpi install\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pi-apply-patch ${version} is distributed via git: pi install git:github.com/${GITHUB_REPOSITORY}"

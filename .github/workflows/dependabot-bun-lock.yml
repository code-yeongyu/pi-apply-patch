name: dependabot bun.lock

# Dependabot's npm updater rewrites package.json and package-lock.json but never bun.lock, so `bun install
# --frozen-lockfile` in ci.yml fails on every npm bump before a test runs. This refreshes bun.lock on Dependabot's
# branches. The commit's own pull_request CI run is held for approval (github-actions[bot] counts as a first-time
# contributor), so the job approves it, or dispatches ci.yml if it cannot.

on:
  push:
    branches: ["dependabot/npm_and_yarn/**"]

permissions:
  contents: read

jobs:
  refresh:
    name: refresh bun.lock
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level, so a skipped run from someone else's push cannot cancel a refresh between its push and the CI dispatch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # No dependency lifecycle scripts: this job holds a write token.
      - name: Refresh bun.lock
        run: bun install --ignore-scripts

      - name: Commit and re-run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          if [ -n "$(git status --porcelain -- . ':!bun.lock')" ]; then
            git status --porcelain
            echo "::error::bun install changed files other than bun.lock; not committing"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): refresh bun.lock" -- bun.lock
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          # The push creates this commit's pull_request CI run, held for approval because github-actions[bot] counts as a
          # first-time contributor. Approving it attaches the required checks to the PR; if it cannot be found or approved,
          # a dispatched run still checks the commit, though its checks do not show on the PR.
          sha=$(git rev-parse HEAD)
          run_id=""
          for attempt in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request --json databaseId --jq '.[0].databaseId // empty' || true)
            [ -n "$run_id" ] && break
            [ "$attempt" -lt 12 ] && sleep 5
          done
          if [ -n "$run_id" ] && gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"; then
            echo "approved pull_request run ${run_id}"
          else
            echo "::warning::could not approve the pull_request run (id: ${run_id:-none}); dispatching ci.yml instead"
            gh workflow run ci.yml --ref "$BRANCH"
          fi
